<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Diamond Price Prediction</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        * {
            box-sizing: border-box;
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #1e3c72, #2a5298);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container {
            background: #ffffff;
            padding: 30px;
            border-radius: 14px;
            width: 100%;
            max-width: 900px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
        }

        h1 {
            text-align: center;
            margin-bottom: 25px;
            color: #1e3c72;
        }

        form {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        label {
            font-weight: 600;
            margin-bottom: 6px;
            color: #333;
        }

        input, select {
            padding: 10px 12px;
            border-radius: 8px;
            border: 1px solid #ccc;
            font-size: 14px;
            transition: all 0.3s ease;
        }

        input:focus, select:focus {
            outline: none;
            border-color: #2a5298;
            box-shadow: 0 0 0 2px rgba(42,82,152,0.15);
        }

        .full-width {
            grid-column: 1 / -1;
        }

        button {
            background: linear-gradient(135deg, #1e3c72, #2a5298);
            color: #fff;
            border: none;
            padding: 14px;
            font-size: 16px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
        }

        .result {
            margin-top: 25px;
            padding: 15px;
            background: #f4f7ff;
            border-left: 5px solid #2a5298;
            border-radius: 8px;
            font-size: 18px;
            font-weight: 600;
            color: #1e3c72;
            text-align: center;
        }

        @media (max-width: 600px) {
            .container {
                padding: 20px;
            }
            h1 {
                font-size: 22px;
            }
        }
    </style>
</head>

<body>

<div class="container">
    <h1>💎 Diamond Price Prediction</h1>

    <form action="{{ url_for('predict_datapoint') }}" method="POST">

        <div class="form-group">
            <label>Carat</label>
            <input type="number" step="0.01" name="carat" placeholder="e.g. 0.75" required>
        </div>

        <div class="form-group">
            <label>Depth</label>
            <input type="number" step="0.01" name="depth" placeholder="e.g. 61.5" required>
        </div>

        <div class="form-group">
            <label>Table</label>
            <input type="number" step="0.01" name="table" placeholder="e.g. 55" required>
        </div>

        <div class="form-group">
            <label>X (mm)</label>
            <input type="number" step="0.01" name="x" required>
        </div>

        <div class="form-group">
            <label>Y (mm)</label>
            <input type="number" step="0.01" name="y" required>
        </div>

        <div class="form-group">
            <label>Z (mm)</label>
            <input type="number" step="0.01" name="z" required>
        </div>

        <div class="form-group">
            <label>Cut</label>
            <select name="cut">
                <option>Fair</option>
                <option>Good</option>
                <option>Very Good</option>
                <option>Premium</option>
                <option>Ideal</option>
            </select>
        </div>

        <div class="form-group">
            <label>Color</label>
            <select name="color">
                <option>D</option>
                <option>E</option>
                <option>F</option>
                <option>G</option>
                <option>H</option>
                <option>I</option>
                <option>J</option>
            </select>
        </div>

        <div class="form-group">
            <label>Clarity</label>
            <select name="clarity">
                <option>I1</option>
                <option>SI2</option>
                <option>SI1</option>
                <option>VS2</option>
                <option>VS1</option>
                <option>VVS2</option>
                <option>VVS1</option>
                <option>IF</option>
            </select>
        </div>

        <div class="form-group full-width">
            <button type="submit">🔮 Predict Price</button>
        </div>

    </form>

    {% if final_result %}
    <div class="result">
        Predicted Price: ₹ {{ final_result }}
    </div>
    {% endif %}
</div>

</body>
</html>
